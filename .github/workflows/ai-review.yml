name: ai-review

# Label a ready PR ai:pr-agent for one review.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: JakobMelchard/.github/.github/workflows/ai-review.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
