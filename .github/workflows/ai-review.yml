name: ai-review

# Label a ready PR ai:pr-agent for one review.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: JakobMelchard/.github/.github/workflows/ai-review.yml@153ecfd6362b6c1ec0be3f39d7020f36b2525e48 # v2.2.2
