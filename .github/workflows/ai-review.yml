name: ai-review

# Label a ready PR ai:pr-agent for one review.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: JakobMelchard/.github/.github/workflows/ai-review.yml@307a3b212591007521c674a5cc65abe76d43314d # v2.2.1
