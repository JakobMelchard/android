name: ai-review

# Label a ready PR ai:pr-agent for one review.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  review:
    uses: JakobMelchard/.github/.github/workflows/ai-review.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
