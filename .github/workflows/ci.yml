name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One call for both apps keeps the required check names (ci / ci, ci / pr-title).
  ci:
    uses: JakobMelchard/.github/.github/workflows/android.yml@f0d18d59dc51bf3c06ce4747ec91f6a4b7c208c9 # v2.5.0
    with:
      setup-cmd: python3 -m unittest discover -s scripts -p 'test_*.py'
      java-version: "17"
      android-packages: platforms;android-36 build-tools;36.0.0
      gradle-tasks: >-
        ktlintCheck
        :apps:fz:ktlintCheck :apps:fz:testDebugUnitTest :apps:fz:lintDebug :apps:fz:assembleDebug
        :apps:pull:ktlintCheck :apps:pull:testDebugUnitTest :apps:pull:lintDebug :apps:pull:assembleDebug
      artifact-name: debug-apks
      artifact-path: apps/*/build/outputs/apk/debug/*.apk
