name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    # Owner sets BOTH variables only after provisioning and approving cutover.
    # An unset destination never matches, including in this local pilot or source repos.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ANDROID_RELEASE_ENABLED == 'true' &&
      vars.ANDROID_RELEASE_REPOSITORY == github.repository
    uses: JakobMelchard/.github/.github/workflows/release.yml@df18859960a81d988ca3c7498bdd6a2dc976fec9 # v2.6.0
    permissions:
      contents: read
      id-token: write

  plan:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          PATHS_RELEASED: ${{ needs.release.outputs.paths_released }}
          RELEASES: ${{ needs.release.outputs.releases }}
        run: |
          matrix=$(python3 scripts/release-plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  apk:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-path: /release
          recursive: false
      - name: build selected component
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ matrix.version }}
        run: |
          prefix=$(printf '%s' "$APP" | tr '[:lower:]' '[:upper:]')
          export "${prefix}_KEYSTORE_B64=$ANDROID_KEYSTORE_B64"
          export "${prefix}_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
          export "${prefix}_KEY_ALIAS=${ANDROID_KEY_ALIAS:-}"
          if [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            export "${prefix}_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          fi
          unset ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          scripts/release-apk "$APP" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.app }}-${{ matrix.version }}
          path: ${{ matrix.app }}-${{ matrix.version }}.apk
          if-no-files-found: error
          retention-days: 1

  # No checkout, Gradle, signing credentials or OIDC in the writable job.
  upload:
    needs: [plan, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-${{ matrix.app }}-${{ matrix.version }}
      - name: upload selected APK
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag_name }}
        run: gh release upload "$TAG" "$APP-$VERSION.apk" --clobber --repo "$GITHUB_REPOSITORY"
