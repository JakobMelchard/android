# Hooks come from pinned repos; Renovate bumps the revs. CI runs the same config through
# JakobMelchard/.github hooks.yml. Setup: brew install prek && prek install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  - repo: https://github.com/JakobMelchard/.githooks
    rev: v1.0.1
    hooks:
      - id: conventional-commit
  # CI runs ktlintCheck in the android job, so hooks.yml skips it.
  - repo: local
    hooks:
      - id: ktlint
        name: ktlint
        entry: make lint
        language: system
        files: \.kts?$
        pass_filenames: false
      - id: release-apk-test
        name: release-apk test
        entry: scripts/release-apk_test.sh
        language: system
        files: ^scripts/release-apk
        pass_filenames: false
