name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/android.yml@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1
    with:
      android-packages: platforms;android-35 build-tools;35.0.0
      gradle-tasks: ktlintCheck lintDebug testDebugUnitTest assembleDebug
      artifact-path: app/build/outputs/apk/debug/*.apk

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1
    with:
      skip: ktlint
