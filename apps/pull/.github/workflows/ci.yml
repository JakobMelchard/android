name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/android.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    with:
      android-packages: platforms;android-35 build-tools;35.0.0
      gradle-tasks: ktlintCheck lintDebug testDebugUnitTest assembleDebug
      artifact-path: app/build/outputs/apk/debug/*.apk

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
